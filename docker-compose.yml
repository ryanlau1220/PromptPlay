services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PROMPTPLAY_FAUCET_ENABLED: ${PROMPTPLAY_FAUCET_ENABLED:-false}
      FAUCET_KEY_PATH: /run/secrets/faucet-key.json
      PROMPTPLAY_LIVE_INFERENCE: ${PROMPTPLAY_LIVE_INFERENCE:-false}
      PROMPTPLAY_PROVIDER_AUTHORIZED: ${PROMPTPLAY_PROVIDER_AUTHORIZED:-false}
      REDEMPTION_ALLOWLIST: ${REDEMPTION_ALLOWLIST:-}
      ESCROW_ACCOUNT: ${ESCROW_ACCOUNT:-}
      ESCROW_OWNER: ${ESCROW_OWNER:-}
      ESCROW_CODE_HASH: ${ESCROW_CODE_HASH:-}
      ESCROW_KEY_PATH: /run/secrets/escrow-key.json
      PROMPTPLAY_PROVIDER_FUNDED: ${PROMPTPLAY_PROVIDER_FUNDED:-false}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-https://cloud-api.near.ai/v1}
      INFERENCE_MODEL: ${INFERENCE_MODEL:-zai-org/GLM-5.1-FP8}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      INFERENCE_PROVIDER_NAME: ${INFERENCE_PROVIDER_NAME:-OpenAI-compatible}
      INFERENCE_SUPPORTS_STREAMING: ${INFERENCE_SUPPORTS_STREAMING:-false}
      INFERENCE_SUPPORTS_TOOL_CALLS: ${INFERENCE_SUPPORTS_TOOL_CALLS:-false}
      INFERENCE_CAP_MICROUNITS: ${INFERENCE_CAP_MICROUNITS:-1000000}
      INPUT_MICROS_PER_MILLION: ${INPUT_MICROS_PER_MILLION:-}
      OUTPUT_MICROS_PER_MILLION: ${OUTPUT_MICROS_PER_MILLION:-}
      MICROS_PER_UNIT: ${MICROS_PER_UNIT:-}
      MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-}
    volumes:
      - promptplay-data:/data
      - ${FAUCET_KEY_FILE:-./apps/server/.env.example}:/run/secrets/faucet-key.json:ro
      - ${ESCROW_KEY_FILE:-./apps/server/.env.example}:/run/secrets/escrow-key.json:ro
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_NEAR_RPC_URL: ${VITE_NEAR_RPC_URL:-https://rpc.testnet.fastnear.com}
    depends_on:
      - server
volumes:
  promptplay-data:
